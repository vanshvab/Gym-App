<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>CUT MESO1</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CUT MESO1">
<meta name="theme-color" content="#DCE0E4">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --steel:#DCE0E4;
  --plate:#F6F7F8;
  --ink:#1C242B;
  --ink-soft:#5C6B77;
  --line:#BFC7CE;
  --hold:#1E6F5C;
  --over:#B85C10;
  --drop:#9E2B2B;
  --r:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--steel);
  color:var(--ink);
  font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums;
  padding-bottom:calc(68px + env(safe-area-inset-bottom));
  -webkit-user-select:none;user-select:none;
}
input,button,select{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

header{padding:calc(14px + env(safe-area-inset-top)) 0 10px}
header h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.02em}
header .sub{color:var(--ink-soft);font-size:13px;margin-top:2px}

.view{display:none;padding-bottom:24px}
.view.on{display:block}

h2{font-size:13px;font-weight:600;color:var(--ink-soft);margin:22px 0 8px}
.card{background:var(--plate);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 13px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .nm{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mt{font-size:12.5px;color:var(--ink-soft);margin-top:1px}
.row .val{font-size:17px;font-weight:600}
.tap{cursor:pointer}
.tap:active{background:#EDEFF1}

.days{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px}
.day{background:var(--plate);border:1px solid var(--line);border-radius:var(--r);padding:9px 8px;text-align:left;cursor:pointer}
.day.sel{background:var(--ink);border-color:var(--ink);color:#fff}
.day b{display:block;font-size:15px;font-weight:600}
.day span{font-size:11.5px;opacity:.72;display:block;line-height:1.25;margin-top:1px}

.big{font-size:40px;font-weight:650;letter-spacing:-.02em;line-height:1}
.big .u{font-size:16px;font-weight:500;color:var(--ink-soft);letter-spacing:0}

.gauge{background:var(--plate);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px}
.bar{height:7px;background:#CDD4D9;border-radius:4px;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:var(--hold)}
.bar i.over{background:var(--over)}

.rpe{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.rpe button{background:var(--plate);border:1px solid var(--line);border-radius:8px;padding:11px 0;font-size:15px;font-weight:600}
.rpe button.hot{border-color:var(--over);color:var(--over)}
.rpe button.sel{background:var(--ink);border-color:var(--ink);color:#fff}
.rpe button.sel.hot{background:var(--over);border-color:var(--over);color:#fff}

.fields{display:flex;gap:8px;margin-top:8px}
.fields label{flex:1}
.fields span{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:3px}
input[type=number],input[type=text],input[type=date]{
  width:100%;background:#fff;border:1px solid var(--line);border-radius:8px;
  padding:11px 10px;font-size:17px;font-weight:500;-webkit-appearance:none;
}
input:focus{outline:2px solid var(--ink);outline-offset:-1px}
.btn{width:100%;margin-top:10px;background:var(--ink);color:#fff;border:0;border-radius:var(--r);padding:14px;font-size:16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:active{opacity:.8}

.warn{margin-top:9px;padding:10px 12px;border-radius:8px;background:#F6E8D8;border:1px solid #E0BE93;font-size:13.5px;line-height:1.35}
.warn b{color:var(--over)}

.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;background:var(--plate);border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:14px}
.chip:active{background:#E9EBED}

.empty{color:var(--ink-soft);font-size:14px;padding:16px 13px;line-height:1.5}
.del{color:var(--drop);font-size:13px;padding:4px 6px;background:none;border:0}

.tag{font-size:11px;font-weight:600;padding:2px 6px;border-radius:5px;background:#E3E7EA;color:var(--ink-soft)}
.tag.hold{background:#DDEDE8;color:var(--hold)}
.tag.over{background:#F6E8D8;color:var(--over)}
.tag.drop{background:#F4DEDE;color:var(--drop)}

nav{
  position:fixed;left:0;right:0;bottom:0;z-index:9;
  background:rgba(246,247,248,.94);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
  display:grid;grid-template-columns:repeat(4,1fr);
}
nav button{background:none;border:0;padding:11px 0 12px;font-size:12px;color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--ink);font-weight:600}
nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1 id="hTitle">CUT MESO1</h1>
    <div class="sub" id="hSub">—</div>
  </header>

  <!-- ТРЕНУВАННЯ -->
  <section class="view on" id="v-gym">
    <div class="days" id="dayGrid"></div>
    <h2 id="exHead">Вправи</h2>
    <div class="card" id="exList"></div>
    <button class="btn ghost" id="addEx">Додати вправу в цей день</button>
  </section>

  <!-- ЇЖА -->
  <section class="view" id="v-food">
    <div class="gauge">
      <div class="big"><span id="kcalNow">0</span> <span class="u">/ <span id="kcalGoal">0</span> ккал</span></div>
      <div class="bar"><i id="kcalBar" style="width:0"></i></div>
      <div class="row" style="padding:11px 0 0;border:0;gap:18px">
        <div class="grow"><div class="mt">Білок</div><div class="val" id="pNow">0 г</div></div>
        <div class="grow"><div class="mt">Вуглеводи</div><div class="val" id="cNow">0 г</div></div>
        <div class="grow"><div class="mt">Жири</div><div class="val" id="fNow">0 г</div></div>
      </div>
    </div>

    <h2>Швидко додати</h2>
    <div class="chips" id="foodChips"></div>

    <h2>Зʼїдено сьогодні</h2>
    <div class="card" id="mealList"></div>

    <button class="btn ghost" id="newFood">Новий продукт у довідник</button>
  </section>

  <!-- ВАГА -->
  <section class="view" id="v-weight">
    <div class="gauge">
      <div class="big"><span id="wAvg">—</span> <span class="u">кг · середнє за 7 днів</span></div>
      <div class="bar"><i id="wBar" style="width:0"></i></div>
      <div class="mt" id="wNote" style="margin-top:9px;font-size:13.5px;color:var(--ink-soft)"></div>
    </div>
    <div class="fields">
      <label><span>Вага зранку</span><input type="number" id="wIn" step="0.1" inputmode="decimal" placeholder="86.4"></label>
      <label style="flex:0 0 42%"><span>Дата</span><input type="date" id="wDate"></label>
    </div>
    <button class="btn" id="wSave">Записати вагу</button>
    <h2>Останні записи</h2>
    <div class="card" id="wList"></div>
  </section>

  <!-- ТИЖДЕНЬ -->
  <section class="view" id="v-week">
    <h2>Чекін за 7 днів</h2>
    <div class="card" id="weekTop"></div>
    <h2>Сети по мʼязах</h2>
    <div class="card" id="volList"></div>
    <h2>Вага на штанзі проти минулого тижня</h2>
    <div class="card" id="loadList"></div>
    <h2>Налаштування</h2>
    <div class="fields">
      <label><span>Цільова вага, кг</span><input type="number" id="sGoal" step="0.5" inputmode="decimal"></label>
      <label><span>Ккал/день</span><input type="number" id="sKcal" inputmode="numeric"></label>
    </div>
    <div class="fields">
      <label><span>Білок, г</span><input type="number" id="sProt" inputmode="numeric"></label>
      <label><span>Стеля RPE</span><input type="number" id="sRpe" step="0.5" inputmode="decimal"></label>
    </div>
    <button class="btn" id="sSave">Зберегти налаштування</button>
    <button class="btn ghost" id="expo">Експорт даних у файл</button>
  </section>
</div>

<nav>
  <button class="on" data-v="gym"><svg viewBox="0 0 24 24"><path d="M4 8v8M8 6v12M16 6v12M20 8v8M8 12h8"/></svg>Тренування</button>
  <button data-v="food"><svg viewBox="0 0 24 24"><path d="M6 3v8a3 3 0 006 0V3M9 11v10M18 3c-1.5 2-2 4-2 7v11"/></svg>Їжа</button>
  <button data-v="weight"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 12l4-4"/></svg>Вага</button>
  <button data-v="week"><svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>Тиждень</button>
</nav>

<script>
/* ---------- сховище ---------- */
const KEY='cutmeso:v1';
async function load(){
  try{ if(window.storage){ const r=await window.storage.get(KEY,false); if(r&&r.value) return JSON.parse(r.value); } }catch(e){}
  try{ const v=localStorage.getItem(KEY); if(v) return JSON.parse(v); }catch(e){}
  return null;
}
let saveT=null;
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    const s=JSON.stringify(S);
    try{ localStorage.setItem(KEY,s); }catch(e){}
    try{ if(window.storage) await window.storage.set(KEY,s,false); }catch(e){}
  },250);
}

/* ---------- стартові дані ---------- */
const DEF_DAYS=[
  {id:'D1',t:'Upper Heavy',ex:[
    ['Barbell Bench Press','Груди'],['Weighted Pull-Up','Спина'],['Overhead Press','Плечі'],
    ['Barbell Row','Спина'],['Close-Grip Bench Press','Трицепс']]},
  {id:'D2',t:'Lower Heavy',ex:[
    ['Back Squat','Квадрицепс'],['Romanian Deadlift','Біцепс стегна'],['Leg Press','Квадрицепс'],
    ['Standing Calf Raise','Гомілки']]},
  {id:'D3',t:'Upper Light',ex:[
    ['Incline Dumbbell Press','Груди'],['Lat Pulldown','Спина'],['Cable Lateral Raise','Плечі'],
    ['Barbell Shrug','Трапеції'],['Chest-Supported Row','Спина']]},
  {id:'D4',t:'Lower Light',ex:[
    ['Hack Squat','Квадрицепс'],['Seated Leg Curl','Біцепс стегна'],['Hip Thrust','Сідниці'],
    ['Seated Calf Raise','Гомілки']]},
  {id:'D5',t:'Arms & Core',ex:[
    ['Barbell Curl','Біцепс'],['Skull Crusher','Трицепс'],['Incline Dumbbell Curl','Біцепс'],
    ['Cable Overhead Extension','Трицепс'],['Hanging Leg Raise','Абс'],['Cable Crunch','Абс']]},
  {id:'D6',t:'Weak Points',ex:[
    ['Dumbbell Shrug','Трапеції'],['Neck Extension','Шия'],['Face Pull','Задні делти'],
    ['Reverse Fly','Задні делти'],['Wrist Curl','Передпліччя']]},
];
const DEF_FOODS=[
  {n:'Курячі груди',k:165,p:31,c:0,f:3.6},
  {n:'Яйце',k:143,p:12.6,c:0.7,f:9.5},
  {n:'Рис відварений',k:130,p:2.7,c:28,f:0.3},
  {n:'Skyr натуральний',k:63,p:11,c:4,f:0.2},
  {n:'Овсянка суха',k:379,p:13,c:67,f:7},
  {n:'Лосось',k:208,p:20,c:0,f:13},
  {n:'Банан',k:89,p:1.1,c:23,f:0.3},
  {n:'Оливкова олія',k:884,p:0,c:0,f:100},
];

let S=null;
function fresh(){
  return {
    set:{goal:82,kcal:2200,prot:180,rpe:8},
    days:DEF_DAYS.map(d=>({id:d.id,t:d.t,ex:d.ex.map(e=>({n:e[0],m:e[1]}))})),
    sets:[], foods:DEF_FOODS.slice(), meals:[], weights:[], day:'D1'
  };
}

/* ---------- утиліти ---------- */
const D=s=>new Date(s);
const today=()=>new Date().toISOString().slice(0,10);
const daysAgo=n=>new Date(Date.now()-n*864e5).toISOString().slice(0,10);
const r1=x=>Math.round(x*10)/10;
const el=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/* ---------- навігація ---------- */
document.querySelectorAll('nav button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
    document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+b.dataset.v));
    render();
  };
});

/* ---------- ТРЕНУВАННЯ ---------- */
function renderGym(){
  el('dayGrid').innerHTML=S.days.map(d=>
    `<button class="day ${d.id===S.day?'sel':''}" data-d="${d.id}"><b>${d.id}</b><span>${esc(d.t)}</span></button>`
  ).join('');
  el('dayGrid').querySelectorAll('.day').forEach(b=>b.onclick=()=>{S.day=b.dataset.d;save();renderGym()});

  const day=S.days.find(d=>d.id===S.day);
  el('exHead').textContent=day.t;

  const wk=daysAgo(7);
  el('exList').innerHTML=day.ex.map((e,i)=>{
    const mine=S.sets.filter(s=>s.ex===e.n);
    const last=mine.length?mine[mine.length-1]:null;
    const top=mine.filter(s=>s.d>=wk).reduce((a,s)=>Math.max(a,s.w),0);
    const meta=last
      ? `${esc(e.m)} · останнє ${last.w}кг × ${last.reps} @${last.rpe}`
      : esc(e.m)+' · ще не робив';
    const badge=top?`<span class="tag">${top} кг</span>`:'';
    return `<div class="row tap" data-i="${i}"><div class="grow"><div class="nm">${esc(e.n)}</div>
      <div class="mt">${meta}</div></div>${badge}</div>`;
  }).join('')||`<div class="empty">У цьому дні поки немає вправ.</div>`;

  el('exList').querySelectorAll('.row').forEach(r=>r.onclick=()=>openSet(day.ex[+r.dataset.i]));
}

let pend={rpe:null};
function openSet(ex){
  const mine=S.sets.filter(s=>s.ex===ex.n);
  const last=mine.length?mine[mine.length-1]:null;
  const ceil=S.set.rpe;
  const vals=[6,6.5,7,7.5,8,8.5,9,9.5,10];
  pend={rpe:null};
  sheet(esc(ex.n),`
    <div class="fields">
      <label><span>Вага, кг</span><input type="number" id="iW" step="0.5" inputmode="decimal" value="${last?last.w:''}"></label>
      <label><span>Повторення</span><input type="number" id="iR" inputmode="numeric" value="${last?last.reps:''}"></label>
    </div>
    <div class="mt" style="margin-top:14px;font-size:12px;color:var(--ink-soft)">RPE — стеля ${ceil}</div>
    <div class="rpe" id="rpeGrid">${vals.map(v=>
      `<button data-v="${v}" class="${v>ceil?'hot':''}">${v}</button>`).join('')}</div>
    <div id="rpeWarn"></div>
    <button class="btn" id="setSave">Записати сет</button>
  `,()=>{
    const g=el('rpeGrid');
    g.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      pend.rpe=+b.dataset.v;
      g.querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b));
      el('rpeWarn').innerHTML = pend.rpe>ceil
        ? `<div class="warn">Це <b>вище стелі ${ceil}</b>. На куті мета — тримати вагу на штанзі, а не добивати до відказу. Записати можна, але це вже враховується як вихід за план.</div>`
        : '';
    });
    el('setSave').onclick=()=>{
      const w=parseFloat(el('iW').value), reps=parseInt(el('iR').value);
      if(!(w>0)||!(reps>0)){el('rpeWarn').innerHTML='<div class="warn">Впиши вагу і повторення.</div>';return}
      if(pend.rpe===null){el('rpeWarn').innerHTML='<div class="warn">Вибери RPE — без нього стеля не працює.</div>';return}
      S.sets.push({d:today(),ts:Date.now(),day:S.day,ex:ex.n,m:ex.m,w:w,reps:reps,rpe:pend.rpe});
      save();closeSheet();renderGym();
    };
  });
}

el('addEx').onclick=()=>{
  sheet('Нова вправа',`
    <div class="fields"><label><span>Назва (як у Hevy)</span><input type="text" id="nE" placeholder="Cable Shrug"></label></div>
    <div class="fields"><label><span>Мʼяз</span><input type="text" id="nM" placeholder="Трапеції"></label></div>
    <button class="btn" id="okE">Додати в ${S.day}</button>`,()=>{
      el('okE').onclick=()=>{
        const n=el('nE').value.trim(), m=el('nM').value.trim()||'Інше';
        if(!n)return;
        S.days.find(d=>d.id===S.day).ex.push({n,m});
        save();closeSheet();renderGym();
      };
  });
};

/* ---------- ЇЖА ---------- */
function todayMeals(){return S.meals.filter(m=>m.d===today())}
function renderFood(){
  const t=todayMeals().reduce((a,m)=>({k:a.k+m.k,p:a.p+m.p,c:a.c+m.c,f:a.f+m.f}),{k:0,p:0,c:0,f:0});
  el('kcalNow').textContent=Math.round(t.k);
  el('kcalGoal').textContent=S.set.kcal;
  const pct=Math.min(100,t.k/S.set.kcal*100);
  const bar=el('kcalBar'); bar.style.width=pct+'%';
  bar.classList.toggle('over',t.k>S.set.kcal);
  el('pNow').textContent=Math.round(t.p)+' / '+S.set.prot+' г';
  el('cNow').textContent=Math.round(t.c)+' г';
  el('fNow').textContent=Math.round(t.f)+' г';

  el('foodChips').innerHTML=S.foods.map((f,i)=>`<button class="chip" data-i="${i}">${esc(f.n)}</button>`).join('');
  el('foodChips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>openFood(S.foods[+b.dataset.i]));

  el('mealList').innerHTML=todayMeals().map((m,i)=>
    `<div class="row"><div class="grow"><div class="nm">${esc(m.n)}</div>
      <div class="mt">${m.g} г · Б ${r1(m.p)} · В ${r1(m.c)} · Ж ${r1(m.f)}</div></div>
      <div class="val">${Math.round(m.k)}</div>
      <button class="del" data-x="${i}">Прибрати</button></div>`).join('')
    ||`<div class="empty">Сьогодні ще нічого. Тапни продукт зверху.</div>`;
  el('mealList').querySelectorAll('.del').forEach(b=>b.onclick=()=>{
    const list=todayMeals(); const t2=list[+b.dataset.x];
    S.meals=S.meals.filter(m=>m!==t2); save(); renderFood();
  });
}
function openFood(f){
  sheet(esc(f.n),`
    <div class="mt" style="font-size:13px;color:var(--ink-soft)">На 100 г: ${f.k} ккал · Б ${f.p} · В ${f.c} · Ж ${f.f}</div>
    <div class="fields"><label><span>Скільки грамів</span><input type="number" id="fG" inputmode="numeric" value="100"></label></div>
    <div class="chips" style="margin-top:8px">${[50,100,150,200,250].map(g=>`<button class="chip" data-g="${g}">${g} г</button>`).join('')}</div>
    <button class="btn" id="okF">Додати в день</button>`,()=>{
      document.querySelectorAll('.sheet .chip').forEach(b=>b.onclick=()=>el('fG').value=b.dataset.g);
      el('okF').onclick=()=>{
        const g=parseFloat(el('fG').value); if(!(g>0))return;
        const r=g/100;
        S.meals.push({d:today(),n:f.n,g:g,k:f.k*r,p:f.p*r,c:f.c*r,f:f.f*r});
        save();closeSheet();renderFood();
      };
  });
}
el('newFood').onclick=()=>{
  sheet('Новий продукт',`
    <div class="mt" style="font-size:13px;color:var(--ink-soft)">Значення на 100 г — як на упаковці</div>
    <div class="fields"><label><span>Назва</span><input type="text" id="qn" placeholder="Kyllingfilet"></label></div>
    <div class="fields">
      <label><span>Ккал</span><input type="number" id="qk" inputmode="numeric"></label>
      <label><span>Білок</span><input type="number" id="qp" step="0.1" inputmode="decimal"></label>
    </div>
    <div class="fields">
      <label><span>Вуглеводи</span><input type="number" id="qc" step="0.1" inputmode="decimal"></label>
      <label><span>Жири</span><input type="number" id="qf" step="0.1" inputmode="decimal"></label>
    </div>
    <button class="btn" id="okQ">Зберегти в довідник</button>`,()=>{
      el('okQ').onclick=()=>{
        const n=el('qn').value.trim(); if(!n)return;
        S.foods.unshift({n:n,k:+el('qk').value||0,p:+el('qp').value||0,c:+el('qc').value||0,f:+el('qf').value||0});
        save();closeSheet();renderFood();
      };
  });
};

/* ---------- ВАГА ---------- */
function avg7(offset=0){
  const hi=daysAgo(offset), lo=daysAgo(offset+7);
  const v=S.weights.filter(w=>w.d>lo&&w.d<=hi).map(w=>w.kg);
  return v.length? v.reduce((a,b)=>a+b,0)/v.length : null;
}
function renderWeight(){
  const a=avg7(), prev=avg7(7);
  el('wAvg').textContent=a?r1(a):'—';
  const start=S.weights.length?S.weights[0].kg:null;
  if(a&&start&&start>S.set.goal){
    const done=Math.max(0,Math.min(1,(start-a)/(start-S.set.goal)));
    el('wBar').style.width=(done*100)+'%';
  }
  let note='Записуй вагу зранку — окремі дні шумлять, працює тільки середнє.';
  if(a&&prev){
    const dd=a-prev, wk=r1(dd);
    const left=a-S.set.goal;
    if(dd<-0.1&&left>0){
      const weeks=Math.ceil(left/Math.abs(dd));
      note=`За тиждень ${wk} кг. До ${S.set.goal} кг лишилось ${r1(left)} кг — приблизно ${weeks} тижнів у цьому темпі.`;
      if(Math.abs(dd)>1.0) note+=' Це швидше за 1 кг/тиждень — на такому дефіциті ризик втрати мʼязів росте.';
    } else if(dd>=-0.1&&dd<=0.1){
      note=`Вага стоїть (${wk} кг за тиждень). Якщо так другий тиждень — дефіцит уже не дефіцит.`;
    } else if(dd>0.1){
      note=`Вага росте на ${wk} кг за тиждень. Для куту це не той напрямок.`;
    }
  }
  el('wNote').textContent=note;

  el('wList').innerHTML=S.weights.slice(-12).reverse().map(w=>
    `<div class="row"><div class="grow"><div class="nm">${w.d}</div></div><div class="val">${r1(w.kg)} кг</div></div>`
  ).join('')||`<div class="empty">Поки без записів.</div>`;
}
el('wSave').onclick=()=>{
  const kg=parseFloat(el('wIn').value), d=el('wDate').value||today();
  if(!(kg>0))return;
  S.weights=S.weights.filter(w=>w.d!==d);
  S.weights.push({d:d,kg:kg});
  S.weights.sort((a,b)=>a.d<b.d?-1:1);
  el('wIn').value=''; save(); renderWeight();
};

/* ---------- ТИЖДЕНЬ ---------- */
function renderWeek(){
  const wk=daysAgo(7), pw=daysAgo(14);
  const cur=S.sets.filter(s=>s.d>wk), prev=S.sets.filter(s=>s.d>pw&&s.d<=wk);
  const over=cur.filter(s=>s.rpe>S.set.rpe);
  const a=avg7(), p=avg7(7);
  const kdays={}; S.meals.filter(m=>m.d>wk).forEach(m=>kdays[m.d]=(kdays[m.d]||0)+m.k);
  const kv=Object.values(kdays);
  const kavg=kv.length?kv.reduce((x,y)=>x+y,0)/kv.length:null;

  const rows=[];
  rows.push(['Сетів усього',cur.length+' проти '+prev.length+' минулого тижня','']);
  rows.push(['Вихід за стелю RPE',over.length?`${over.length} сетів вище ${S.set.rpe}`:'жодного','tag '+(over.length>3?'over':'hold')]);
  rows.push(['Тренувань',new Set(cur.map(s=>s.d)).size+' днів','']);
  if(a&&p) rows.push(['Вага, зміна за тиждень',r1(a-p)+' кг','tag '+((a-p)<-0.1?'hold':'over')]);
  if(kavg) rows.push(['Калорії, середнє',Math.round(kavg)+' проти цілі '+S.set.kcal,'tag '+(Math.abs(kavg-S.set.kcal)<150?'hold':'over')]);

  el('weekTop').innerHTML=rows.map(r=>
    `<div class="row"><div class="grow"><div class="nm">${r[0]}</div></div><div class="mt">${r[1]}</div></div>`
  ).join('');

  const byM={}; cur.forEach(s=>byM[s.m]=(byM[s.m]||0)+1);
  const ent=Object.entries(byM).sort((x,y)=>y[1]-x[1]);
  el('volList').innerHTML=ent.map(([m,n])=>
    `<div class="row"><div class="grow"><div class="nm">${esc(m)}</div></div><div class="val">${n}</div></div>`
  ).join('')||`<div class="empty">За тиждень ще немає записаних сетів.</div>`;

  const names=[...new Set(cur.map(s=>s.ex))];
  const loads=names.map(n=>{
    const c=Math.max(...cur.filter(s=>s.ex===n).map(s=>s.w));
    const ps=prev.filter(s=>s.ex===n).map(s=>s.w);
    const pm=ps.length?Math.max(...ps):null;
    return {n,c,pm,dd:pm?c-pm:null};
  });
  el('loadList').innerHTML=loads.map(l=>{
    let tag='<span class="tag">новий</span>';
    if(l.dd!==null){
      if(l.dd>0.4) tag=`<span class="tag hold">+${r1(l.dd)} кг</span>`;
      else if(l.dd<-0.4) tag=`<span class="tag drop">${r1(l.dd)} кг</span>`;
      else tag='<span class="tag hold">тримається</span>';
    }
    return `<div class="row"><div class="grow"><div class="nm">${esc(l.n)}</div>
      <div class="mt">макс ${l.c} кг${l.pm?' · було '+l.pm:''}</div></div>${tag}</div>`;
  }).join('')||`<div class="empty">Потрібні два тижні даних, щоб порівнювати.</div>`;

  el('sGoal').value=S.set.goal; el('sKcal').value=S.set.kcal;
  el('sProt').value=S.set.prot; el('sRpe').value=S.set.rpe;
}
el('sSave').onclick=()=>{
  S.set.goal=+el('sGoal').value||82; S.set.kcal=+el('sKcal').value||2200;
  S.set.prot=+el('sProt').value||180; S.set.rpe=+el('sRpe').value||8;
  save(); render();
};
el('expo').onclick=()=>{
  const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download='cutmeso-'+today()+'.json'; a.click();
};

/* ---------- шторка ---------- */
function sheet(title,html,after){
  closeSheet();
  const d=document.createElement('div');
  d.className='sheet';
  d.style.cssText='position:fixed;inset:0;z-index:20;background:rgba(28,36,43,.4);display:flex;align-items:flex-end';
  d.innerHTML=`<div style="background:var(--steel);width:100%;max-width:560px;margin:0 auto;border-radius:16px 16px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:4px">
      <div style="flex:1;font-size:17px;font-weight:600">${title}</div>
      <button id="xClose" style="background:none;border:0;font-size:15px;color:var(--ink-soft);padding:4px 2px">Закрити</button>
    </div>${html}</div>`;
  d.onclick=e=>{if(e.target===d)closeSheet()};
  document.body.appendChild(d);
  el('xClose').onclick=closeSheet;
  if(after)after();
}
function closeSheet(){document.querySelectorAll('.sheet').forEach(s=>s.remove())}

/* ---------- рендер ---------- */
function render(){
  const wk=daysAgo(7);
  const n=S.sets.filter(s=>s.d>wk).length;
  const a=avg7();
  el('hSub').textContent=`${a?r1(a)+' кг':'вага не внесена'} · ціль ${S.set.goal} кг · ${n} сетів за тиждень`;
  if(el('v-gym').classList.contains('on'))renderGym();
  if(el('v-food').classList.contains('on'))renderFood();
  if(el('v-weight').classList.contains('on'))renderWeight();
  if(el('v-week').classList.contains('on'))renderWeek();
}

(async()=>{
  S=await load();
  if(!S||!S.days) S=fresh();
  if(!S.set) S.set={goal:82,kcal:2200,prot:180,rpe:8};
  el('wDate').value=today();
  render();
})();

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
