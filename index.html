<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cut Meso</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cut Meso">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#0e0e0f; --ink:#f2f2f3; --muted:#8d8d92;
    --card:#18181a; --card-bd:#232326; --row-bd:#202024;
    --field:#121213; --field-bd:#2a2a2e; --pill:#1f1f22; --pill-bd:#2a2a2e;
    --up:#6fbf8f; --down:#d0897d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
  body{font-family:"Plus Jakarta Sans",-apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums;}
  input{font-family:inherit;}
  input::placeholder{color:#5e5e64;}
  button{font-family:inherit;-webkit-appearance:none;appearance:none;}
  a{color:#cfcfd4;}
  .app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);}
  .screen{flex:1;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 22px) 16px 24px;-webkit-overflow-scrolling:touch;}
  .nav{border-top:1px solid var(--row-bd);background:#121213;padding:8px 4px calc(env(safe-area-inset-bottom,0px) + 10px);display:grid;grid-template-columns:repeat(5,1fr);flex-shrink:0;}
  .nav button{cursor:pointer;background:none;border:0;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:48px;font-size:10.5px;font-weight:600;}
  h1,h2,h3{font-family:inherit;}
  .sq{cursor:pointer;}
  ::selection{background:rgba(242,242,243,0.25);}
</style>
</head>
<body>
<div class="app">
  <main id="screen" class="screen"></main>
  <nav id="nav" class="nav"></nav>
</div>

<script>
'use strict';

/* ---------- persistence ---------- */
var STORE_KEY = 'cutmeso.state.v1';
function genFriendId(){
  var letters = 'ABCDEFGHJKLMNPQRSTUVWXYZ', s = '';
  for (var i = 0; i < 3; i++) s += letters[Math.floor(Math.random() * letters.length)];
  return s + '-' + Math.floor(1000 + Math.random() * 9000);
}
function loadState(){
  // A brand-new account starts empty: zero logs, zero history, no seeded
  // exercises/weights. The only "defaults" here are app settings (rest
  // timer length, mesocycle length, phase) — never anything that reads
  // like the user's own recorded data.
  var jsIdx = (new Date().getDay() + 6) % 7; // Mon=0 .. Sun=6, matches weekLog order
  var defaults = {
    tab: 'dash', day: 'D1', exIdx: 0, setsN: 3, kcal: 0, phase: null,
    pickerMode: null, muscle: 'All', openId: null, saved: [], custom: {},
    rest: 150, restOpen: false, weeks: 6, week: 1, deload: true,
    myEx: null, createOpen: false, query: '', draft: { n: '', m: '', e: '', w: '', note: '' },
    dayMeta: null, supersets: {}, types: {}, nutMode: 'Consumed', wkDay: jsIdx,
    vals: {}, doneSet: {}, menuKey: null, confirmOpen: false,
    photoSlots: [{ label: 'Week 1', src: '' }, { label: 'Week 6', src: '' }],
    weightDraft: '', weightLog: [],
    loggedMeals: [], friendId: genFriendId(),
    delMeals: [], delMeasures: [], delHist: []
  };
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (!raw) return defaults;
    var saved = JSON.parse(raw);
    var merged = Object.assign({}, defaults, saved);
    if (!merged.friendId) merged.friendId = defaults.friendId;
    return merged;
  } catch (e) { return defaults; }
}
var S = loadState();
var UNIT = 'kg';
function persist(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {}
}

/* ---------- tiny helpers ---------- */
function esc(s){
  return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
function idSafe(s){ return String(s).replace(/[^a-zA-Z0-9_-]/g, '_'); }
function resolvePath(obj, path){
  var parts = path.replace(/\[(\d+)\]/g, '.$1').split('.');
  var cur = obj;
  for (var i = 0; i < parts.length; i++) {
    if (cur == null) return null;
    cur = cur[parts[i]];
  }
  return cur;
}

/* ---------- view-model (mirrors the design's render logic) ---------- */
function computeVM(){
  var t = S.tab;
  var ink = '#f2f2f3', muted = '#8d8d92', faint = '#8d8d92', dim = '#8d8d92';
  var up = '#6fbf8f', down = '#d0897d';
  var go = function(tab){ return function(){ S.tab = tab; }; };
  var sect = (t === 'picker' || t === 'days' || t === 'dash' || t === 'daypick') ? 'workout'
    : (t === 'history' || t === 'session') ? 'coach' : t;
  var num = function(s){ return parseFloat(String(s).split('×')[0].replace(/[^0-9.]/g, '')) || 0; };
  var repsOf = function(s){ return parseFloat(String(String(s).split('×')[1] || '').replace(/[^0-9.]/g, '')) || 0; };
  var unit = UNIT;
  var phase = S.phase || 'Cut';

  // A fresh mesocycle ships with empty day slots only — no seeded exercises,
  // weights, or "previous" numbers. Users build their own program from
  // scratch via "+ Add day" / "+ Add exercise" / "Create my own exercise".
  var defaults = [
    { id: 'D1', t: 'Day 1', ex: [] },
    { id: 'D2', t: 'Day 2', ex: [] },
    { id: 'D3', t: 'Day 3', ex: [] },
    { id: 'D4', t: 'Day 4', ex: [] },
    { id: 'D5', t: 'Day 5', ex: [] },
    { id: 'D6', t: 'Day 6', ex: [] }
  ];

  var meta = S.dayMeta || defaults.map(function(d){ return { id: d.id, t: d.t, note: '' }; });
  var dayDefs = meta.map(function(m){
    var base = defaults.filter(function(d){ return d.id === m.id; })[0];
    return { id: m.id, t: m.t, note: m.note || '', ex: S.custom[m.id] || (base ? base.ex : []) };
  });
  var at = function(i){ return dayDefs[i] || dayDefs[0] || { id: 'D1', t: 'Day', ex: [] }; };
  var day = dayDefs.filter(function(d){ return d.id === S.day; })[0] || dayDefs[0];
  var ex = day.ex[Math.min(S.exIdx, day.ex.length - 1)] || { n: 'No exercise', tags: 'add one below', prev: '—', w: '0' };

  var rirPlan = [2, 1, 0, 0, 0];
  var groups = S.supersets[day.id] || [];
  var exIdx = Math.min(S.exIdx, Math.max(0, day.ex.length - 1));
  var grp = (groups.filter(function(g){ return g.indexOf(exIdx) >= 0; })[0] || [exIdx]).filter(function(i){ return day.ex[i]; });
  var grpEx = grp.map(function(i){ return day.ex[i]; });
  var letters = ['A1', 'A2', 'A3', 'A4'];
  var slotColors = ['#6e8fd9', '#d9a84e', '#6fbf8f', '#d9705e'];
  var rounds = Math.max(1, S.setsN);
  var rowsPer = Math.max(1, grpEx.length);
  var typeStyles = {
    normal: { mark: '', bg: 'transparent', fg: '#f2f2f3', bd: '#2a2a2e' },
    warmup: { mark: 'W', bg: '#2a2213', fg: '#d9a84e', bd: '#4a3a1c' },
    failure: { mark: 'F', bg: '#2a1615', fg: '#d9705e', bd: '#4a2521' },
    drop:   { mark: 'D', bg: '#161d2c', fg: '#6e8fd9', bd: '#22314c' }
  };
  var typeMenu = [
    { id: 'warmup', label: 'Warm-up set' },
    { id: 'normal', label: 'Normal set' },
    { id: 'failure', label: 'Failure set' },
    { id: 'drop', label: 'Drop set' },
    { id: 'remove', label: 'Remove set' }
  ];
  var dropRound = function(){ S.setsN = Math.max(1, S.setsN - 1); S.menuKey = null; };
  var sets = [];
  var workingSets = 0;
  var firstOpen = null;
  for (var r = 0; r < rounds; r++) {
    for (var k = 0; k < rowsPer; k++) {
      (function(r, k){
        var e = grpEx[k] || ex;
        var key = day.id + '|' + e.n + '|' + r + '|' + k;
        var type = S.types[key] || (r === 0 ? 'warmup' : 'normal');
        var st = typeStyles[type] || typeStyles.normal;
        var doneRow = !!S.doneSet[key];
        var v = S.vals[key] || {};
        var baseW = type === 'drop' ? String(Math.round(num(e.w) * 0.7 * 2) / 2) : String(e.w);
        var baseReps = type === 'warmup' ? '8' : type === 'drop' ? String(14 - r) : String(10 - r);
        var baseRir = type === 'warmup' ? '5' : (type === 'failure' || type === 'drop') ? '0'
          : String(rirPlan[r] === undefined ? 0 : rirPlan[r]);
        if (type !== 'warmup') workingSets++;
        var isNext = !doneRow && firstOpen === null;
        if (isNext) firstOpen = key;
        var setVal = function(field, value){
          S.vals[key] = Object.assign({}, S.vals[key], {});
          S.vals[key][field] = value;
        };
        sets.push({
          key: key,
          n: st.mark || String(r + 1),
          slot: rowsPer > 1 ? letters[k] : '',
          slotBg: rowsPer > 1 ? slotColors[k % 4] : 'transparent',
          slotFg: rowsPer > 1 ? '#0b0b0c' : 'transparent',
          roundTop: rowsPer > 1 && k === 0 && r > 0 ? '#2f2f36' : 'transparent',
          prev: r < 3 ? e.prev : '—',
          w: v.w === undefined ? baseW : v.w,
          reps: v.reps === undefined ? baseReps : v.reps,
          rir: v.rir === undefined ? baseRir : v.rir,
          onW: function(ev){ setVal('w', ev.target.value); },
          onReps: function(ev){ setVal('reps', ev.target.value); },
          onRir: function(ev){ setVal('rir', ev.target.value); },
          tBg: st.bg, tFg: st.fg, tBd: st.bd,
          rowBg: doneRow ? '#141d17' : isNext ? '#1b1b1f' : 'transparent',
          edge: doneRow ? '#4f8f63' : isNext ? '#f2f2f3' : 'transparent',
          bd: doneRow ? '#2c4a36' : isNext ? '#3f3f48' : '#2a2a2e',
          fill: doneRow ? '#16211a' : '#121213',
          checkBg: doneRow ? '#4f8f63' : 'transparent',
          checkBd: doneRow ? '#4f8f63' : isNext ? '#4f4f58' : '#3a3a42',
          checkFg: doneRow ? '#0b0b0c' : isNext ? '#f2f2f3' : '#8d8d92',
          toggleDone: function(){
            if (S.doneSet[key]) delete S.doneSet[key]; else S.doneSet[key] = true;
            S.menuKey = null;
          },
          menuOpen: S.menuKey === key,
          openMenu: function(){ S.menuKey = (S.menuKey === key) ? null : key; },
          menu: typeMenu.map(function(o){
            var ms = typeStyles[o.id];
            return {
              label: o.label,
              mark: ms ? (ms.mark || String(r + 1)) : '×',
              chipBg: ms ? ms.bg : '#2a1615',
              chipFg: ms ? ms.fg : '#d9705e',
              bg: o.id === type ? '#1d1d20' : 'transparent',
              fg: o.id === 'remove' ? '#d9705e' : '#f2f2f3',
              go: function(){
                if (o.id === 'remove') { dropRound(); return; }
                S.types[key] = o.id;
                delete S.vals[key];
                S.menuKey = null;
              }
            };
          }),
          del: dropRound
        });
      })(r, k);
    }
  }
  var doneCount = sets.filter(function(s){ return s.checkBg !== 'transparent'; }).length;
  var sessionWorking = workingSets + Math.max(0, (day.ex.length - grpEx.length) * (rounds - 1));

  var phaseNames = ['Cut', 'Bulk', 'Maintain'];
  var kcalFor = function(p){ return p === 'Bulk' ? 3050 : p === 'Maintain' ? 2650 : 2200; };
  var kcalGoal = kcalFor(phase);

  // Quick-add catalog: reference nutrition facts (roughly per typical
  // serving), not the user's own data — always available, unlike anything
  // logged. p/c/f let the macro summary below be real once something is
  // actually logged, instead of a fixed fake percentage.
  var foods = [
    { n: 'Chicken breast', k: 165, p: 31, c: 0, f: 3.6 }, { n: 'Skyr', k: 63, p: 11, c: 4, f: 0.2 },
    { n: 'Egg', k: 143, p: 12, c: 1, f: 10 }, { n: 'White rice', k: 130, p: 2.7, c: 28, f: 0.3 },
    { n: 'Salmon', k: 208, p: 20, c: 0, f: 13 }, { n: 'Banana', k: 89, p: 1.1, c: 23, f: 0.3 }
  ];

  var mmss = function(sec){ return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); };
  var weeks = S.weeks, week = Math.min(S.week, weeks);
  var rirTarget = S.deload && week === weeks ? '4' : String(Math.max(0, 3 - (week - 1)));
  var fmt = function(n){ return Math.round(n).toLocaleString('en-US').replace(/,/g, ' '); };

  var kcalToday = S.kcal;
  // Only "today" (real weekday) carries live data; the rest of the week
  // starts at zero until the user actually logs something on that day.
  var weekDayLabels = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
  var loggedP = S.loggedMeals.filter(function(m){ return S.delMeals.indexOf(m.id) < 0; }).reduce(function(a, m){ return a + (m.p || 0); }, 0);
  var loggedC = S.loggedMeals.filter(function(m){ return S.delMeals.indexOf(m.id) < 0; }).reduce(function(a, m){ return a + (m.c || 0); }, 0);
  var loggedF = S.loggedMeals.filter(function(m){ return S.delMeals.indexOf(m.id) < 0; }).reduce(function(a, m){ return a + (m.f || 0); }, 0);
  var weekLog = weekDayLabels.map(function(d, i){
    return i === S.wkDay ? { d: d, k: kcalToday, p: loggedP, c: loggedC, f: loggedF } : { d: d, k: 0, p: 0, c: 0, f: 0 };
  });
  var goalsMacro = { k: kcalGoal, p: 180, c: 230, f: 62 };
  var macros = [
    { label: 'Protein', val: Math.round(loggedP) + ' / ' + goalsMacro.p + ' g', pct: Math.min(100, Math.round(loggedP / goalsMacro.p * 100)) + '%', color: '#d9705e' },
    { label: 'Carbs', val: Math.round(loggedC) + ' / ' + goalsMacro.c + ' g', pct: Math.min(100, Math.round(loggedC / goalsMacro.c * 100)) + '%', color: '#d9a84e' },
    { label: 'Fat', val: Math.round(loggedF) + ' / ' + goalsMacro.f + ' g', pct: Math.min(100, Math.round(loggedF / goalsMacro.f * 100)) + '%', color: '#6fbf8f' }
  ];
  var remaining = S.nutMode === 'Remaining';
  var sel = Math.min(S.wkDay, 6);
  var metricDefs = [
    { key: 'k', fill: '#6e8fd9', suffix: '' },
    { key: 'p', fill: '#d9705e', suffix: ' P' },
    { key: 'c', fill: '#d9a84e', suffix: ' C' },
    { key: 'f', fill: '#6fbf8f', suffix: ' F' }
  ];
  var nutRows = metricDefs.map(function(m){
    var goal = goalsMacro[m.key];
    var selVal = weekLog[sel][m.key];
    var shown = remaining ? Math.max(0, goal - selVal) : selVal;
    return {
      total: (m.key === 'k' ? fmt(shown) : Math.round(shown)) + m.suffix,
      goal: (remaining ? 'left of ' : 'of ') + (m.key === 'k' ? fmt(goal) : goal),
      cols: weekLog.map(function(wd, i){
        var v = wd[m.key];
        var val = remaining ? (v ? Math.max(0, goal - v) : goal) : v;
        return {
          h: Math.min(100, Math.round((val / goal) * 100)) + '%',
          fill: v ? m.fill : '#2a2a2e',
          ring: i === sel ? '1px solid #4a4a52' : 'none'
        };
      })
    };
  });

  var calPct = Math.min(100, Math.round((kcalToday / kcalGoal) * 100));
  var calDots = [];
  for (var i = 0; i < 28; i++) calDots.push({ bg: i < Math.round(calPct * 28 / 100) ? '#f2f2f3' : '#2a2a2e' });

  var tonsOf = function(d){
    return d.ex.reduce(function(a, e){
      var r = repsOf(e.prev) || 9;
      return { now: a.now + num(e.w) * r * 3, prev: a.prev + num(e.prev) * r * 3 };
    }, { now: 0, prev: 0 });
  };
  var cur = tonsOf(day);
  var ton = cur.now;
  var prevTon = cur.prev || cur.now;
  var d1 = tonsOf(at(0));
  var deltaPct = prevTon ? ((ton - prevTon) / prevTon) * 100 : 0;

  var seen = {};
  var derived = [];
  dayDefs.forEach(function(d){ d.ex.forEach(function(e){
    if (seen[e.n]) return;
    seen[e.n] = 1;
    var parts = String(e.tags).split(' · ');
    derived.push({ n: e.n, m: parts[0], eq: parts[1] || 'custom', w: e.w });
  }); });
  var myBase = S.myEx || derived;
  var muscles = ['All'].concat(myBase.map(function(b){ return b.m; }).filter(function(m, i, a){ return a.indexOf(m) === i; }));
  var q = S.query.trim().toLowerCase();
  var setDraft = function(key, v){ S.draft[key] = v; };
  var saveCreated = function(){
    var d = S.draft;
    var n = (d.n || '').trim();
    if (!n) return;
    var rec = { n: n, m: (d.m || '').trim() || 'Other', eq: (d.e || '').trim() || 'custom',
      w: (d.w || '').trim() || '0', note: (d.note || '').trim() };
    var list = day.ex.slice();
    var idx = Math.min(S.exIdx, list.length - 1);
    var replacing = S.pickerMode === 'replace';
    var entry = { n: rec.n, tags: rec.m + ' · ' + rec.eq, prev: '—', w: rec.w };
    if (replacing && list.length) list[idx] = entry; else list.push(entry);
    S.custom[day.id] = list;
    S.myEx = myBase.concat([rec]);
    S.createOpen = false; S.pickerMode = null; S.tab = 'workout';
    S.doneSet = {}; S.vals = {}; S.menuKey = null; S.setsN = 3;
    S.exIdx = replacing ? Math.max(0, idx) : list.length - 1;
    S.draft = { n: '', m: '', e: '', w: '', note: '' };
  };
  var applyPick = function(item){
    var list = day.ex.slice();
    var rec = { n: item.n, tags: item.m + ' · ' + item.eq, prev: '—', w: item.w };
    var idx = Math.min(S.exIdx, list.length - 1);
    var replacing = S.pickerMode === 'replace';
    if (replacing && list.length) list[idx] = rec; else list.push(rec);
    S.custom[day.id] = list;
    S.pickerMode = null; S.tab = 'workout';
    S.doneSet = {}; S.vals = {}; S.menuKey = null; S.setsN = 3;
    S.exIdx = replacing ? Math.max(0, idx) : list.length - 1;
  };

  // No seeded history: a fresh account has logged nothing yet, so the list
  // is exactly what the user has actually saved.
  var wl = S.weightLog;
  var recent = wl.slice(-7);
  var bodyAvg = recent.length ? recent.reduce(function(a, w){ return a + w.kg; }, 0) / recent.length : 0;
  var weightTrend = wl.length > 1 ? wl[wl.length - 1].kg - wl[0].kg : 0;
  var weeklyRate = wl.length > 1 ? weightTrend / Math.max(1, (wl.length - 1) / 7) : 0;

  var baseDay = defaults.filter(function(d){ return d.id === day.id; })[0];
  var baseNames = baseDay ? baseDay.ex.map(function(e){ return e.n; }) : [];
  var curNames = day.ex.map(function(e){ return e.n; });
  var added = curNames.filter(function(n){ return baseNames.indexOf(n) < 0; });
  var dropped = baseNames.filter(function(n){ return curNames.indexOf(n) < 0; });
  var hasSuperset = (S.supersets[day.id] || []).some(function(g){ return g.length > 1; });
  var planDirty = added.length > 0 || dropped.length > 0 || hasSuperset;
  var planChanges = [
    added.length ? 'added ' + added.join(', ') : '',
    dropped.length ? 'removed ' + dropped.join(', ') : '',
    hasSuperset ? 'a superset was paired' : ''
  ].filter(Boolean).join(' · ') + '. Keep it for next time, or log today only?';
  var commitSession = function(){
    S.saved = [{
      id: day.id, t: day.t, date: 'today',
      meta: sessionWorking + (sessionWorking === 1 ? ' working set · ' : ' working sets · ') + fmt(ton) + ' ' + unit + ' · RIR 1.2',
      delta: (ton >= prevTon ? '+' : '−') + Math.abs(deltaPct).toFixed(1) + ' %',
      label: 'tonnage', color: ton >= prevTon ? up : down
    }].concat(S.saved);
    S.tab = 'history'; S.openId = null; S.confirmOpen = false;
  };

  var history = S.saved
    .filter(function(h){ return S.delHist.indexOf(h.id + h.date) < 0; });
  var open = history[S.openId || 0] || history[0] || { id: day.id, t: day.t, date: '', meta: '', delta: '+0.0 %', label: '', color: muted };
  var openDay = dayDefs.filter(function(d){ return d.id === open.id; })[0] || day;

  return {
    isDash: t === 'dash', isDayPick: t === 'daypick',
    isWorkout: t === 'workout', isFood: t === 'food', isCoach: t === 'coach',
    isBody: t === 'body', isSettings: t === 'settings',
    isPicker: t === 'picker', isHistory: t === 'history', isSession: t === 'session', isDays: t === 'days',
    goDash: go('dash'), goDayPick: go('daypick'), goWorkout: go('workout'),
    goFood: go('food'), goCoach: go('coach'), goBody: go('body'),
    goSettings: go('settings'), goHistory: go('history'), goDays: go('days'),
    nav: {
      workout: sect === 'workout' ? ink : dim, food: sect === 'food' ? ink : dim,
      coach: sect === 'coach' ? ink : dim, body: sect === 'body' ? ink : dim,
      settings: sect === 'settings' ? ink : dim
    },
    greeting: 'Welcome back, Vansh',
    phaseLabel: phase + ' · MESO 2',
    phaseShort: phase,
    unitLabel: unit,
    dashSessions: String(history.length),
    dashTonnage: fmt(ton) + ' ' + unit,
    dashNext: day.ex.length + ' exercises · ' + (day.note || 'target RIR ' + rirTarget),
    calPctLabel: calPct + '%',
    calDots: calDots,
    calNote: kcalToday === 0
      ? 'Nothing logged yet today.'
      : kcalToday > kcalGoal
      ? fmt(kcalToday - kcalGoal) + ' kcal over target.'

function exportData(){
  try {
    var blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'cut-meso-data.json';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 0);
  } catch (e) {}
}

function buildNavHTML(vm){
  function item(act, icon, label, color){
    return '<button class="sq" data-act="' + act + '" style="color:' + color + ';">' + icon + label + '</button>';
  }
  return item('goDash', ICONS.navTrain, 'Train', vm.nav.workout) +
    item('goFood', ICONS.navFood, 'Food', vm.nav.food) +
    item('goCoach', ICONS.navAnalytics, 'Analytics', vm.nav.coach) +
    item('goBody', ICONS.navBody, 'Body', vm.nav.body) +
    item('goSettings', ICONS.navSettings, 'Profile', vm.nav.settings);
}

function buildScreenHTML(vm){
  if (vm.isDash) return screenDash(vm);
  if (vm.isDayPick) return screenDayPick(vm);
  if (vm.isWorkout) return screenWorkout(vm);
  if (vm.isPicker) return screenPicker(vm);
  if (vm.isDays) return screenDays(vm);
  if (vm.isHistory) return screenHistory(vm);
  if (vm.isSession) return screenSession(vm);
  if (vm.isFood) return screenFood(vm);
  if (vm.isCoach) return screenCoach(vm);
  if (vm.isBody) return screenBody(vm);
  if (vm.isSettings) return screenSettings(vm);
  return '';
}

/* ---------- render loop ---------- */
var screenEl = document.getElementById('screen');
var navEl = document.getElementById('nav');
var VM = null;
var renderQueued = false;

function render(){
  var active = document.activeElement;
  var focusInfo = null;
  if (active && active.id && (screenEl.contains(active))) {
    focusInfo = { id: active.id, start: active.selectionStart, end: active.selectionEnd, scrollTop: screenEl.scrollTop };
  } else if (active && active.id) {
    focusInfo = { id: active.id, start: active.selectionStart, end: active.selectionEnd, scrollTop: screenEl.scrollTop };
  }
  var prevScroll = screenEl.scrollTop;
  VM = computeVM();
  screenEl.innerHTML = buildScreenHTML(VM);
  navEl.innerHTML = buildNavHTML(VM);
  screenEl.scrollTop = prevScroll;
  if (focusInfo) {
    var el = document.getElementById(focusInfo.id);
    if (el) {
      el.focus({ preventScroll: true });
      if (typeof focusInfo.start === 'number' && el.setSelectionRange) {
        try { el.setSelectionRange(focusInfo.start, focusInfo.end); } catch (e) {}
      }
    }
  }
  persist();
}
function scheduleRender(){ render(); }

function onAct(e){
  var target = e.target.closest('[data-act]');
  if (!target) return;
  var path = target.getAttribute('data-act');
  var fn = resolvePath(VM, path);
  if (typeof fn === 'function') {
    fn(e);
    render();
  }
}
screenEl.addEventListener('click', onAct);
screenEl.addEventListener('input', onAct);
screenEl.addEventListener('change', onAct);
navEl.addEventListener('click', onAct);

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    // updateViaCache:'none' stops the browser from serving a stale sw.js out
    // of its own HTTP cache when checking for updates — without it, a build
    // can sit "live" but unreachable for anyone whose browser cached the old
    // worker script. reg.update() forces an immediate check on load, and a
    // one-time reload on controllerchange gets an already-open tab onto the
    // new build as soon as it activates, instead of leaving it stuck until
    // the next manual refresh.
    var hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(function(reg){
      reg.update().catch(function(){});
    }).catch(function(){});
    var reloadedOnce = false;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if (!hadController || reloadedOnce) { hadController = true; return; }
      reloadedOnce = true;
      window.location.reload();
    });
  });
}
